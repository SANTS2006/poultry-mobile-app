# Local development only: PostgreSQL + the API. Production uses Neon (see docs/deployment/production-deployment.md).
# Usage:  docker compose up --build      then      docker compose run --rm migrate
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: makarifor }
    ports: ['5432:5432']
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U postgres'], interval: 5s, retries: 10 }
  migrate:
    build: { context: ./backend, target: tools }
    profiles: ['tools']
    depends_on: { db: { condition: service_healthy } }
    environment: &env
      APP_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/makarifor
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@db:5432/makarifor
      JWT_SECRET: dev-only-jwt-secret-change-me-0123456789
      JWT_REFRESH_SECRET: dev-only-refresh-secret-change-me-0123456789
      DATA_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    command: sh -c "npx prisma migrate deploy && npx ts-node prisma/seed.ts"
  api:
    build: { context: ./backend, target: runtime }
    depends_on: { db: { condition: service_healthy } }
    environment: *env
    ports: ['3000:3000']
volumes:
  dbdata: {}
