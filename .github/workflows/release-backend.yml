name: release-backend
# Tag a release (v1.2.3) to build the API image. Deploying and migrating are separate, approval-gated jobs.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  migrate:
    # Runs `prisma migrate deploy` against the environment's database. Requires manual approval (configure required reviewers on the "production" environment).
    needs: image
    runs-on: ubuntu-latest
    environment: production
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - name: Back up before migrating (fails the release if the backup fails)
        run: |
          sudo apt-get install -y postgresql-client >/dev/null
          ./scripts/backup.sh ./backups 1
        env: { DIRECT_DATABASE_URL: '${{ secrets.DIRECT_DATABASE_URL }}' }
      - run: npx prisma migrate deploy
        env: { DATABASE_URL: '${{ secrets.DIRECT_DATABASE_URL }}', DIRECT_DATABASE_URL: '${{ secrets.DIRECT_DATABASE_URL }}' }
      # After migrating, re-apply grants for new tables:  psql "$DIRECT_DATABASE_URL" -v app_password="'…'" -f prisma/sql/app_role.sql
      # Deploying the image is host-specific (Render / Fly.io / Railway / a VM): add that step here once the host is chosen.
