name: release-backend
# Tag a release (v1.2.3) to back up and migrate the production database (manual approval). Deploying the API itself is done on your host (see docs/deployment/production-deployment.md).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    # Runs `prisma migrate deploy` against the environment's database. Requires manual approval (configure required reviewers on the "production" environment).
    runs-on: ubuntu-latest
    environment: production
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - name: Back up before migrating (fails the release if the backup fails)
        run: |
          sudo apt-get install -y postgresql-client >/dev/null
          ./scripts/backup.sh ./backups 1
        env: { DIRECT_DATABASE_URL: '${{ secrets.DIRECT_DATABASE_URL }}' }
      - run: npx prisma migrate deploy
        env: { DATABASE_URL: '${{ secrets.DIRECT_DATABASE_URL }}', DIRECT_DATABASE_URL: '${{ secrets.DIRECT_DATABASE_URL }}' }
      # After migrating, re-apply grants for new tables:  psql "$DIRECT_DATABASE_URL" -v app_password="'…'" -f prisma/sql/app_role.sql
      # Deploying the API is host-specific (a VM, Render, Railway, Fly.io…): add that step here once the host is chosen.
